<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yozish.uz — prototip</title>
<style>
:root{color-scheme:light;--bg:#fafaf7;--fg:#1b1b1b;--mut:#6b6b68;--bd:#d6d6d0;--sf:#f0f0ea;--cur:#ffe9a3;--ok:#1d7a3e;--err:#c0392b;--nw:#dfe9ff;--nx:#ffd36b;--bl:#2d8ed8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181a;--fg:#e9e9e6;--mut:#9a9a96;--bd:#34383b;--sf:#212427;--cur:#5b4b12;--ok:#2f9e57;--err:#d9534f;--nw:#26334d;--nx:#8a6a10;--bl:#2d78b8}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16181a;--fg:#e9e9e6;--mut:#9a9a96;--bd:#34383b;--sf:#212427;--cur:#5b4b12;--ok:#2f9e57;--err:#d9534f;--nw:#26334d;--nx:#8a6a10;--bl:#2d78b8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:4px 12px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--nx);border-color:var(--fg)}
h1{font-size:20px;margin:0 0 8px}
h2{font-size:17px;margin:20px 0 8px}
#top{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#tr{display:flex;gap:12px;align-items:center;color:var(--mut)}
#tr svg{background:var(--sf);border-radius:50%;border:1px solid var(--bd)}
#st{color:var(--mut)}
.g{display:grid;grid-template-columns:200px 1fr;gap:20px}
#side{display:flex;flex-direction:column;gap:6px}
#side .c{border-color:var(--fg);font-weight:600}
.ls{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--sf)}
.ls.cur{border-color:var(--fg)}
.lt{display:flex;align-items:center;gap:8px}
.lt button{margin-left:auto}
.no{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border:1px solid var(--bd);border-radius:50%;font-size:13px}
.sg{display:flex;gap:2px;margin-top:8px}
.sg i{flex:1;height:6px;background:var(--bd);border-radius:2px}
.sg i.f{background:var(--ok)}
.sg i.c{background:var(--nx)}
.bar{display:flex;align-items:center;gap:12px;padding:8px 0}
.bar b{flex:1;text-align:center}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;text-align:center;margin:12px 0}
.big{font-size:26px;margin:12px 0}
.kbx{display:inline-block;min-width:56px;padding:0 12px;border:2px solid var(--fg);border-radius:8px;font-size:34px;line-height:1.4}
.kbx.bad{background:var(--err);color:#fff}
.bx{display:flex;gap:8px;margin:12px 0}
.bx span{flex:1;height:90px;display:flex;align-items:center;justify-content:center;font:48px ui-monospace,Menlo,monospace;background:var(--sf);border:1px solid var(--bd);border-radius:8px}
.bx .ok{background:var(--ok);color:#fff}
.bx .cur{background:var(--bl);color:#fff}
.bx .bad{background:var(--err);color:#fff}
#txt{font:22px/1.8 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;min-height:5em;margin:12px 0}
#txt .ok{color:var(--ok)}
#txt .cur{background:var(--cur);border-bottom:2px solid var(--fg)}
#txt .bad{background:var(--err);color:#fff}
#lv{color:var(--mut);display:flex;gap:16px}
#hint{margin:8px 0;min-height:1.5em}
#kb{display:flex;flex-direction:column;gap:4px;align-items:flex-start;overflow-x:auto;padding:4px 0}
.r{display:flex;gap:4px}
.k{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:6px;background:var(--sf);font-style:normal}
.k.n{background:var(--nw);font-weight:700}
.k.x{background:var(--bl);color:#fff;border-color:var(--fg)}
.sp{width:230px}
.stars{font-size:40px;color:#e6b422;letter-spacing:4px}
.pb{height:10px;background:var(--bd);border-radius:5px;overflow:hidden;margin:6px 0}
.pb i{display:block;height:100%;background:var(--bl)}
.sn{display:flex;gap:2px;margin:8px 0}
.sn i{flex:1;text-align:center;font-style:normal;font-size:12px;background:var(--bd);border-radius:2px;padding:2px 0}
.sn i.f{background:var(--nx)}
.sn i.c{outline:2px solid var(--fg)}
details{margin:12px 0}
textarea{width:100%;min-height:70px;font:inherit;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:6px;box-sizing:border-box}
td,th{padding:2px 10px;text-align:left}
@media(max-width:640px){.g{grid-template-columns:1fr}#side{flex-direction:row}.bx span{height:60px;font-size:32px}}
</style>
</head>
<body>
<main>
<div id="top"><div id="tr"></div><div id="st"></div></div>
<div id="home" class="g"><nav id="side"></nav><div id="units"></div></div>
<div id="pr" hidden>
 <div class="bar"><button id="ex">« Darslar</button><b id="pt"></b><button id="rd">Qayta</button></div>
 <div class="sg" id="sg"></div>
 <div id="play">
  <div id="fc" class="card" hidden></div>
  <div id="txt"></div><div id="lv"></div><div id="hint"></div><div id="kb"></div>
 </div>
 <div id="res" class="card" hidden></div>
</div>
<details><summary>Yangi harflar klaviaturada</summary>
<table><tr><th>Harf</th><th>Tugma (QWERTY)</th></tr>
<tr><td>Ö ö</td><td>W</td></tr><tr><td>Ğ ğ</td><td>[</td></tr><tr><td>Ş ş</td><td>;</td></tr><tr><td>Ç ç</td><td>C</td></tr><tr><td>ʼ (tutuq)</td><td>'</td></tr></table>
<p style="color:var(--mut)">Bosh harf — Shift bilan. Nuqta va vergul öz joyida. Turk klaviaturasida ö, ğ, ş, ç bor — ular ham qabul qilinadi.</p></details>
<details><summary>Eski lotindan yangi alifboga konvertor (matnlar uçun)</summary>
<textarea id="ci" placeholder="Eski lotin matnini qöying: o‘zbek, g‘alaba, shahar, choy..."></textarea>
<button id="cb">Konvertlaş</button><textarea id="co" readonly></textarea></details>
<p><button id="rs">Boşidan</button></p>
</main>
<script>
const $=s=>document.querySelector(s);
const PASS=90,MAXP=2500,GOAL=900,KEY='yozish.v3',TH=[0,500,1100,1700,2200];
// Yangi harflarning joyi: [oddiy, Shift bilan (US), belgi]
const KEYMAP={KeyW:['w','W','ö'],KeyC:['c','C','ç'],BracketLeft:['[','{','ğ'],Semicolon:[';',':','ş'],Quote:["'",'"','ʼ']};
const ROWS=[['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight'],['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote'],['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash']];
const PL={BracketRight:']',Comma:',',Period:'.',Slash:'/'};
const lab=c=>KEYMAP[c]?KEYMAP[c][2]:c.startsWith('Key')?c[3].toLowerCase():PL[c];
const cap=c=>KEYMAP[c]?KEYMAP[c][0].toUpperCase():lab(c).toUpperCase();
const codeOf={};ROWS.flat().forEach(c=>codeOf[lab(c)]=c);
// Qaysi barmoq bilan bosiladi
const FG=[['çap kiçik barmoq','KeyQ KeyA KeyZ'],['çap halqa barmoq','KeyW KeyS KeyX'],['çap örta barmoq','KeyE KeyD KeyC'],['çap körsatkiç barmoq','KeyR KeyF KeyV KeyT KeyG KeyB'],['öng körsatkiç barmoq','KeyY KeyH KeyN KeyU KeyJ KeyM'],['öng örta barmoq','KeyI KeyK Comma'],['öng halqa barmoq','KeyO KeyL Period'],['öng kiçik barmoq','KeyP Semicolon Slash BracketLeft BracketRight Quote']];
const fing=c=>{const f=FG.find(x=>x[1].split(' ').includes(c));return f?f[0]:''};

// Darslar: k - yangi harflar (har biri alohida örgatiladi), w - sözlar, r - takrorlaş, p - şaxsiy maşq, a - baholaş
const UN=[
{t:'Boşlaniş',ls:[
{t:'F, J va probel',k:['f','j']},
{t:'A va S',k:['a','s']},
{t:'D, K va L',k:['d','k','l'],w:['asal','dala','sakla','salla','kalla','kasal','dalda','alla','fasl','jasad']},
{t:'Takrorlaş 1',r:1}]},
{t:'Kengayiş',ls:[
{t:'Ş, G va H',k:['ş','g','h'],w:['şakl','şal','hasad','galla','ahd','hal']},
{t:'E va I',k:['e','i'],w:['ikki','ilk','iş','esa','dedi','kelsa','dedik','işla','gilas']},
{t:'O va U',k:['o','u'],w:['gul','olis','sol','usul','dolu','huş']},
{t:'Takrorlaş 2',r:1},
{t:'Şaxsiy maşq',p:1}]},
{t:'Yangi harflar',ls:[
{t:'R va T',k:['r','t'],w:['ota','asr','ertak','otasi','terak','turli','tuş','ketdi','keldi','sirli']},
{t:'Q, Y va P',k:['q','y','p'],w:['qayta','qaysi','pul','qop','payt','yiqildi','qarsak','qisqa','pastki','yoş','poyga']},
{t:'Ö va Ğ',k:['ö','ğ'],w:['köl','tör','yöl','köp','yöq','ötkir','ğalla','ğişt','ğayrat','ğor','töğri','öğil']},
{t:'Takrorlaş 3',r:1}]},
{t:'Pastki qator',ls:[
{t:'N, M va B',k:['n','m','b'],w:['non','ona','men','sen','bola','kitob','salom','maktab','qalam','bilan','bahor','nima','bilim','mehnat','bölim','bağ','ğalaba']},
{t:'Z, X va V',k:['z','x','v'],w:['zor','zar','xona','vaqt','uzum','yozuv','xalq','xizmat','zavq','daraxt','kuz','qiz','xazina','vazifa','zamin','bozor']},
{t:'Ç',k:['ç'],w:['çoy','çiroy','çiroq','çaman','çaqmoq','çiziq','çopon','çarx','çeçak','çöl','çorşanba']},
{t:'Tutuq belgisi ʼ',k:['ʼ'],w:['maʼno','eʼlon','maʼlum','taʼlim','maʼqul','eʼtibor','iʼtibor','saʼy','maʼnaviyat','taʼsir']},
{t:'Takrorlaş 4',r:1}]},
{t:'Yakunlaş',ls:[
{t:'Bosh harflar',k:['A','Ö'],w:['Ata','Ona','Özbek','Ötkir','Ğalaba','Ilm','Bahor','Qalam']},
{t:'Nuqta va vergul',k:['.',','],w:['Ota, ona.','Bahor keldi.','Köl, bağ.','Qalam, kitob.','Salom, dost.']},
{t:'Yakuniy takrorlaş',r:1},
{t:'Şaxsiy maşq',p:1},
{t:'Baholaş',a:1}]}
];
// Matnlar: haqiqiy asarlar konvertor bilan tayyorlanib shu yerga qöşiladi
const TEXTS=[
{a:'Namuna',t:'Bahor',text:'Bahor keldi. Daraxtlarda çeçak oçildi, bağda quşlar sayradi.'},
{a:'Namuna',t:'Bilim',text:'Ilm - çiroq, bilim - kuç. Töğri yöl topgan heç qaçon adaşmaydi.'}
];
// Dars ekranlari: har harf avval alohida (topiş + mashq), keyin qöşib, keyin sözlar
function mk(l){
 if(l.k){const s=[];
  l.k.forEach((c,i)=>s.push({t:'f',c},{t:'d',c,pv:l.k.slice(0,i)}));
  if(l.k.length>1)s.push({t:'g'},{t:'g'});
  if(l.w)s.push({t:'w'},{t:'w'},{t:'m'});else s.push({t:'g'},{t:'g'});
  return s}
 if(l.p)return[{t:'p'}];if(l.a)return[{t:'a'}];
 return[0,1,2,3,4].map(()=>({t:'m'}));
}
const ALL=[];let lk=[],cw=[];
UN.forEach(u=>u.ls.forEach(l=>{if(l.k){lk=lk.concat(l.k);if(l.w)cw=cw.concat(l.w)}
 l.lk=lk;l.cw=cw;l.id='k'+ALL.length;l.sc=mk(l);ALL.push(l)}));
const TL=TEXTS.map((t,i)=>({id:'t'+i,t:t.a+': '+t.t,ti:i,lk:[],cw:[],sc:[{t:'t'}]}));

// Progress (bu qurilmada saqlanadi)
let P;try{P=JSON.parse(localStorage.getItem(KEY))}catch(e){}
P=Object.assign({done:{},pts:0,n:0,sw:0,sa:0,sec:0,day:{},keys:{}},P||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const dn=l=>P.done[l.id]||0,full=l=>dn(l)>=l.sc.length;
const today=()=>new Date().toISOString().slice(0,10);
const fmt=s=>String(s/60|0).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
let course=0;
const list=()=>course?TL:ALL;
const opened=i=>course?(i==0?full(ALL[ALL.length-1]):full(TL[i-1])):(i==0||full(ALL[i-1]));
const stage=()=>TH.filter(t=>P.pts>=t).length;

function tree(){
 const g=Math.min(1,P.pts/MAXP),h=10+g*70,top=95-h,w=2+g*6,cr=g*30;
 let s=`<svg viewBox="0 0 120 110" width="110" role="img" aria-label="Nihol"><line x1="15" y1="100" x2="105" y2="100" stroke="#8a8a80"/>`;
 if(g<0.03)s+=`<ellipse cx="60" cy="97" rx="5" ry="3" fill="#8b5a2b"/>`;
 else{s+=`<path d="M60 100 Q${60+g*2} ${100-h/2} 60 ${top+5}" stroke="#8b5a2b" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  const n=Math.round(g*14)+2;
  for(let i=0;i<n;i++){const a=i*2.4,r=cr*Math.sqrt((i+1)/n);s+=`<circle cx="${60+Math.cos(a)*r}" cy="${top+Math.sin(a)*r*.8}" r="${3+g*6}" fill="#3fa34d" fill-opacity=".85"/>`}}
 return s+'</svg>';
}
function head(){
 const stg=stage(),nx=TH[stg];
 $('#tr').innerHTML=tree()+`<div><b>Nihol (${stg}/5)</b><br>Ball: ${P.pts}<br>${nx!=null?'Keyingi bosqiçgaça: '+(nx-P.pts):'Eng yuqori bosqiç'}</div>`;
 $('#st').innerHTML=`Örtaça tezlik: <b>${P.n?Math.round(P.sw/P.n):'--'}</b> söz/daq<br>Örtaça aniqlik: <b>${P.n?Math.round(P.sa/P.n)+'%':'--'}</b><br>Yozilgan vaqt: <b>${fmt(P.sec)}</b> · Kunlik maqsad: <b>${fmt(P.day[today()]||0)}</b> / ${fmt(GOAL)}`;
}
function home(){
 $('#top').hidden=false;$('#home').hidden=false;head();
 $('#side').innerHTML=['Harflarni örganiş','Adabiy matnlar'].map((t,i)=>`<button data-c="${i}" class="${i==course?'c':''}">${t}${i&&!full(ALL[ALL.length-1])?' 🔒':''}</button>`).join('');
 const L=list(),cur=L.findIndex((l,i)=>opened(i)&&!full(l));
 let n=0;
 $('#units').innerHTML=(course?[{t:'Namuna matnlar',ls:TL}]:UN).map(u=>`<h2>${u.t}</h2>`+u.ls.map(l=>{
  const i=n++,o=opened(i),d=dn(l);
  return `<div class="ls ${i==cur?'cur':''}" id="L${i}"><div class="lt"><span class="no">${i+1}</span>${l.t}${l.p?' · 2:00':l.a?' · 1:00':''}<button data-i="${i}" ${o?'':'disabled'}>${!o?'🔒':d==0?'Boşlaş':d<l.sc.length?'Davom etiş':'Qayta'}</button></div><div class="sg">${l.sc.map((_,j)=>`<i class="${j<d?'f':''}"></i>`).join('')}</div></div>`}).join('')).join('');
 const e=$('#L'+cur);if(e&&cur>0)e.scrollIntoView({block:'center'});
}

const R=a=>a[Math.random()*a.length|0];
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const weak=()=>Object.entries(P.keys).filter(([c,v])=>v.t>=5&&v.e/v.t>.05).sort((a,b)=>b[1].e/b[1].t-a[1].e/a[1].t).slice(0,3).map(x=>x[0]);
let S={},CL,CI;
function gen(){
 const s=CL.sc[CI],t=s.t,K=CL.k||[];
 if(t=='t')return TEXTS[CL.ti].text;
 if(t=='d')return Array.from({length:8},(_,i)=>i&&s.pv.length&&Math.random()<.35?R(s.pv):s.c).join('');
 if(t=='g'){const pool=[...K,...K,...CL.lk.filter(c=>!K.includes(c)).slice(-4)];
  return Array.from({length:8},()=>Array.from({length:2+Math.random()*2|0},()=>R(pool)).join('')).join(' ')}
 if(t=='w')return sh(CL.w.concat(CL.w)).slice(0,8).join(' ');
 if(t=='m')return sh(CL.cw.concat(CL.cw)).slice(0,10).join(' ');
 let p=CL.cw;
 if(t=='p'){const wk=weak(),f=p.filter(w=>[...w.toLowerCase()].some(c=>wk.includes(c)));if(f.length>=5)p=f}
 return [0,1,2].map(()=>sh(p).join(' ')).join(' ');
}
function begin(i){CL=list()[i];const d=dn(CL);CI=d>=CL.sc.length?0:d;$('#top').hidden=true;$('#home').hidden=true;$('#pr').hidden=false;start()}
function exit(){clearInterval(S.iv);$('#pr').hidden=true;home()}
function start(){
 clearInterval(S.iv);const s=CL.sc[CI];
 S={text:'',i:0,err:0,tot:0,t0:0,done:false,bad:false,tm:s.t=='p'?120:s.t=='a'?60:0,find:s.t=='f',fc:s.c,found:false};
 if(!S.find)S.text=gen();
 $('#res').hidden=true;$('#res').innerHTML='';$('#play').hidden=false;
 $('#pt').textContent=CL.t;
 $('#sg').innerHTML=CL.sc.map((_,j)=>`<i class="${j<dn(CL)?'f':j==CI?'c':''}"></i>`).join('');
 paint();
}

function paint(){
 const s=CL.sc[CI];
 $('#fc').hidden=!S.find;$('#txt').hidden=S.find;$('#lv').hidden=S.find;
 if(S.find){
  const c=S.fc,fg=fing(codeOf[c.toLowerCase()]),up=c!==c.toLowerCase();
  $('#fc').innerHTML=S.found
   ?`<h2>Topdingiz!</h2><p>Bu <span class="kbx">${c}</span> tugmasi qayerdaligini eslab qoling, endi uni maşq qilamiz!</p><p>Davom etiş uçun <b>ENTER</b> bosing</p><button class="pri" id="go">Davom etiş</button>`
   :`<p>Salom! ${up?'<b>Shift</b> va ':''}<b>${fg}</b> bilan:</p><div class="big">Quyidagi tugmani bosing: <span class="kbx ${S.bad?'bad':''}">${c}</span></div>`;
  if(S.found)$('#go').onclick=adv;
 }else{
  if(s.t=='d')$('#txt').innerHTML='<div class="bx">'+[...S.text].map((ch,j)=>`<span class="${j<S.i?'ok':j==S.i?(S.bad?'cur bad':'cur'):''}">${ch}</span>`).join('')+'</div>';
  else{const a=Math.max(0,S.i-25),seg=S.text.slice(a,a+160);
   $('#txt').innerHTML=[...seg].map((ch,j)=>{const x=a+j;return `<span class="${x<S.i?'ok':x==S.i?(S.bad?'cur bad':'cur'):''}">${ch}</span>`}).join('')}
  const sec=S.t0?(Date.now()-S.t0)/1000:0;
  $('#lv').innerHTML=`<span>Tezlik: ${sec>2?Math.round(S.i/5/(sec/60)):0}</span><span>Aniqlik: ${S.tot?Math.round(100*(S.tot-S.err)/S.tot):100}%</span>`+(S.tm?`<span>⏱ ${fmt(Math.max(0,S.tm-sec))}</span>`:'');
 }
 const tg=S.find?(S.found?'':S.fc):S.text[S.i],lo=tg?tg.toLowerCase():'';
 const ns=new Set(CL.k?CL.k.map(c=>c.toLowerCase()):[]);
 $('#kb').innerHTML=ROWS.map((r,ri)=>`<div class="r" style="margin-left:${ri*14}px">`+r.map(c=>`<i class="k ${ns.has(lab(c))?'n':''} ${lo&&codeOf[lo]==c?'x':''}">${lab(c)}</i>`).join('')+'</div>').join('')+`<div class="r"><i class="k sp ${tg==' '?'x':''}">probel</i></div>`;
 let h='';
 if(tg){if(tg==' ')h='Probel';else{const c=codeOf[lo];h=`<b>${tg}</b> - `+(c?`<b>${cap(c)}</b> tugmasi`:'belgi')+(c&&tg!==lo?' + Shift':'')}}
 $('#hint').innerHTML=h;
}

function charOf(e){
 if(e.ctrlKey||e.metaKey||e.altKey)return null;
 const m=KEYMAP[e.code];
 if(m&&(e.key===m[0]||e.key===m[1]))return e.key===m[1]?m[2].toUpperCase():m[2];
 const k=e.key;if(k.length!==1)return null;
 return "'’ʻ".includes(k)?'ʼ':k;
}
addEventListener('keydown',e=>{
 if(e.target.tagName=='TEXTAREA'||$('#pr').hidden)return;
 if(e.key=='Escape'){exit();return}
 if(e.key=='Enter'){const b=$('#go');if(b&&!b.disabled){e.preventDefault();b.click()}return}
 if(S.done||(S.find&&S.found))return;
 const c=charOf(e);if(c===null)return;
 e.preventDefault();
 if(S.find){if(c===S.fc){S.found=true;S.bad=false}else S.bad=true;paint();return}
 if(!S.t0){S.t0=Date.now();if(S.tm)S.iv=setInterval(()=>{paint();if(Date.now()-S.t0>=S.tm*1000)finish()},500)}
 const tg=S.text[S.i],okk=c===tg;
 S.tot++;
 if(tg!==' '){const k=tg.toLowerCase(),v=P.keys[k]=P.keys[k]||{t:0,e:0};v.t++;if(!okk)v.e++}
 if(okk){S.bad=false;S.i++;if(S.i>=S.text.length){finish();return}}else{S.err++;S.bad=true}
 paint();
});

// Topish ekranidan keyingisiga
function adv(){
 if(CI==dn(CL)){P.done[CL.id]=CI+1;P.pts=Math.min(MAXP,P.pts+5);save()}
 CI++;start();
}
function finish(){
 if(S.done)return;S.done=true;clearInterval(S.iv);
 const s=CL.sc[CI],sec=Math.min(S.tm||1e9,(Date.now()-S.t0)/1000)||1;
 const wpm=Math.round(S.i/5/(sec/60)),acc=S.tot?Math.round(100*(S.tot-S.err)/S.tot):0,ok=acc>=PASS&&S.i>0;
 const stars=!ok?0:acc>=98?3:acc>=94?2:1;
 P.n++;P.sw+=wpm;P.sa+=acc;P.sec+=sec;P.day[today()]=(P.day[today()]||0)+sec;
 let gain=0,msg='';
 if(ok){const first=CI==dn(CL);
  gain=first?(s.t=='p'?30:s.t=='a'?50:10+stars*3):2;
  if(first){P.done[CL.id]=CI+1;if(full(CL))msg='<p><b>Dars tugadi!</b></p>'}
  P.pts=Math.min(MAXP,P.pts+gain)}
 save();
 const d=dn(CL),stg=stage(),lo=TH[stg-1],hi=TH[stg],pct=hi?Math.round(100*(P.pts-lo)/(hi-lo)):100;
 const last=CI+1>=CL.sc.length;
 $('#play').hidden=true;
 const r=$('#res');r.hidden=false;
 r.innerHTML=`<h2>${!ok?'Qayta urinib köring':stars==3?'Ajoyib!':stars==2?'Yaxşi!':'Ötdingiz'}</h2>
 <div class="stars">${'★'.repeat(stars)+'☆'.repeat(3-stars)}</div>
 <p>Tezligingiz <b>${wpm}</b> söz/daq, aniqligi <b>${acc}%</b> (kerak: ${PASS}%)${ok?` · <b>+${gain} ball</b>`:''}</p>${msg}
 <div style="text-align:left"><b>Nihol (${stg}/5)</b> · ${P.pts} ball<div class="pb"><i style="width:${pct}%"></i></div>
 Kunlik maqsad: ${fmt(P.day[today()]||0)} / ${fmt(GOAL)}<br>Dars jarayoni: ${d}/${CL.sc.length} ekran tugadi
 <div class="sn">${CL.sc.map((_,j)=>`<i class="${j<d?'f':j==CI?'c':''}">${j+1}</i>`).join('')}</div></div>
 <p><button id="bk">« Darslarga qaytiş</button> <button id="rdo">Qayta</button> <button class="pri" id="go" ${ok?'':'disabled'}>Davom etiş</button></p>`;
 $('#bk').onclick=exit;$('#rdo').onclick=start;
 $('#go').onclick=()=>{if(last)exit();else{CI++;start()}};
}

$('#units').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)begin(+b.dataset.i)};
$('#side').onclick=e=>{const b=e.target.closest('button');if(b){course=+b.dataset.c;home()}};
$('#ex').onclick=exit;$('#rd').onclick=()=>start();
$('#rs').onclick=e=>{const b=e.target;
 if(!b.dataset.s){b.dataset.s=1;b.textContent='Aniqmi? Yana bosing';setTimeout(()=>{delete b.dataset.s;b.textContent='Boşidan'},3000);return}
 P={done:{},pts:0,n:0,sw:0,sa:0,sec:0,day:{},keys:{}};save();delete b.dataset.s;b.textContent='Boşidan';exit();
};

// Eski lotin -> yangi alifbo (matnlarni tayyorlaş uçun)
function conv(s){
 return s.replace(/[ʻʼ‘’'`´]/g,"'")
  .replace(/([oOgG])'/g,(m,c)=>({o:'ö',O:'Ö',g:'ğ',G:'Ğ'})[c])
  .replace(/sh/g,'ş').replace(/S[hH]/g,'Ş').replace(/ch/g,'ç').replace(/C[hH]/g,'Ç')
  .replace(/'/g,'ʼ');
}
$('#cb').onclick=()=>{$('#co').value=conv($('#ci').value)};
home();
</script>

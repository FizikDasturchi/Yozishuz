<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yozish.uz — prototip</title>
<style>
:root{color-scheme:light;--bg:#fafaf7;--fg:#1b1b1b;--mut:#6b6b68;--bd:#d6d6d0;--sf:#f0f0ea;--cur:#ffe9a3;--ok:#1d7a3e;--err:#c0392b;--nw:#dfe9ff;--nx:#ffd36b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181a;--fg:#e9e9e6;--mut:#9a9a96;--bd:#34383b;--sf:#212427;--cur:#5b4b12;--ok:#6fcf8a;--err:#ff7b72;--nw:#26334d;--nx:#8a6a10}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16181a;--fg:#e9e9e6;--mut:#9a9a96;--bd:#34383b;--sf:#212427;--cur:#5b4b12;--ok:#6fcf8a;--err:#ff7b72;--nw:#26334d;--nx:#8a6a10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}
button{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#map{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
#map .c{border-color:var(--fg);font-weight:600}
#map .d{color:var(--ok)}
#info{margin:8px 0;color:var(--mut)}
#tr{text-align:center;color:var(--mut);margin:8px 0}
#txt{font:22px/1.8 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;min-height:5em}
#txt .ok{color:var(--ok)}
#txt .cur{background:var(--cur);border-bottom:2px solid var(--fg)}
#txt .bad{background:var(--err);color:#fff}
#hint{margin:8px 0;min-height:1.5em}
#kb{display:flex;flex-direction:column;gap:4px;align-items:flex-start;overflow-x:auto;padding:4px 0}
.r{display:flex;gap:4px}
.k{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);border-radius:6px;background:var(--sf);font-style:normal}
.k.n{background:var(--nw);font-weight:700}
.k.x{background:var(--nx);border-color:var(--fg)}
.sp{width:230px}
#res{margin:12px 0;padding:12px;border:1px solid var(--bd);border-radius:8px}
details{margin:12px 0}
textarea{width:100%;min-height:70px;font:inherit;background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:6px;box-sizing:border-box}
td,th{padding:2px 10px;text-align:left}
</style>
</head>
<body>
<main>
<header><h1>yozish.uz <small style="color:var(--mut)">prototip</small></h1><button id="rs">Boşidan</button></header>
<nav id="map"></nav>
<div id="tr"></div>
<section id="info"></section>
<div id="txt"></div>
<div id="hint"></div>
<div id="kb"></div>
<div id="res" hidden></div>
<details open><summary>Yangi harflar klaviaturada</summary>
<table><tr><th>Harf</th><th>Tugma (QWERTY)</th></tr>
<tr><td>Ö ö</td><td>W</td></tr><tr><td>Ğ ğ</td><td>[</td></tr><tr><td>Ş ş</td><td>;</td></tr><tr><td>Ç ç</td><td>C</td></tr><tr><td>ʼ (tutuq)</td><td>'</td></tr></table>
<p style="color:var(--mut)">Bosh harf — Shift bilan. Nuqta va vergul öz joyida. Turk klaviaturasida ö, ğ, ş, ç bor — ular ham qabul qilinadi.</p></details>
<details><summary>Eski lotindan yangi alifboga konvertor (matnlar uçun)</summary>
<textarea id="ci" placeholder="Eski lotin matnini qöying: o‘zbek, g‘alaba, shahar, choy..."></textarea>
<button id="cb">Konvertlaş</button><textarea id="co" readonly></textarea></details>
</main>
<script>
const $=s=>document.querySelector(s);
const PASS=90, MAXP=800, KEY='yozish.v1';
// Yangi harflarning joyi: [oddiy, Shift bilan (US), belgi]
const KEYMAP={KeyW:['w','W','ö'],KeyC:['c','C','ç'],BracketLeft:['[','{','ğ'],Semicolon:[';',':','ş'],Quote:["'",'"','ʼ']};
const ROWS=[['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','BracketLeft','BracketRight'],['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote'],['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash']];
const PL={BracketRight:']',Comma:',',Period:'.',Slash:'/'};
const lab=c=>KEYMAP[c]?KEYMAP[c][2]:c.startsWith('Key')?c[3].toLowerCase():PL[c];
const cap=c=>KEYMAP[c]?KEYMAP[c][0].toUpperCase():lab(c).toUpperCase();
const codeOf={};ROWS.flat().forEach(c=>codeOf[lab(c)]=c);
const EXTRA={'!':'Shift + 1','?':'Shift + /','-':'- (0 yonidagi)'};

// Darajalar: urug'dan daraxtgacha
const LV=[
{n:'Uruğ',e:'🌰',k:'asdf',w:['sad','das','fas','asa','dada','sasa','fafa','dasa']},
{n:'Niş',e:'🌱',k:'jklş',w:['asal','dala','sakla','salla','jasad','şakl','fasl','kalla','alla','kasal','dalda','şal']},
{n:'Köçat',e:'🌿',k:'gh',w:['hasad','galla','ahd','hal','asal','dala','kasal','fasl','şakl','jasad']},
{n:'Nihol',e:'🪴',k:'eiou',w:['ikki','ilk','iş','gul','esa','dedi','kelsa','olis','işla','dedik']},
{n:'Tana',e:'🪵',k:'rt',w:['ota','asr','ertak','otasi','terak','turli','tuş','ketdi','keldi','sirli']},
{n:'Şox',e:'🌳',k:'qyp',w:['qayta','qaysi','pul','qop','payt','yiqildi','qarsak','qisqa','pastki','yoş','poyga']},
{n:'Barg',e:'🍃',k:'öğ',w:['köl','tör','yöl','köp','yöq','ötkir','ğalla','ğişt','ğayrat','ğor','töğri','öğil']},
{n:'Gul',e:'🌸',k:'nmb',w:['non','ona','men','sen','bola','kitob','salom','maktab','qalam','bilan','bahor','nima','bilim','mehnat','bölim','bağ','ğalaba']},
{n:'Meva',e:'🍎',k:'zxv',w:['zor','zar','xona','vaqt','uzum','yozuv','xalq','xizmat','zavq','daraxt','kuz','qiz','xazina','vazifa','zamin','bozor']},
{n:'Daraxt',e:'🌲',k:'ç',w:['çoy','çiroy','çiroq','çaman','çaqmoq','çiziq','çopon','çarx','çeçak','çöl','çorşanba']},
{n:'Çinor',e:'🏞️',k:'ʼ',w:['maʼno','eʼlon','maʼlum','taʼlim','maʼqul','eʼtibor','iʼtibor','saʼy','maʼnaviyat','taʼsir']},
{n:'Bağ',e:'🏡',k:'ÖĞŞÇ.,',w:['Ğalaba!','Özbekiston.','Şahar, bağ.','Çoy içdi.','Qani?','Köl - çiroyli.','Ötkir fikr.','Şoşilma!']},
{n:'Örmon',e:'🌄',tx:1,w:[]}
];
// Matnlar: {a: muallif, t: sarlavha, text: yangi alifboda}. Haqiqiy asarlar konvertor bilan tayyorlanadi.
const TEXTS=[
{a:'Namuna',t:'Bahor',text:'Bahor keldi. Daraxtlarda çeçak oçildi, bağda quşlar sayradi.'},
{a:'Namuna',t:'Bilim',text:'Ilm - çiroq, bilim - kuç. Töğri yöl topgan heç qaçon adaşmaydi.'}
];
const cnt=l=>LV[l].tx?TEXTS.length:3;

// Progress: oxirgi daraja va maşq saqlanadi
let P;try{P=JSON.parse(localStorage.getItem(KEY))}catch(e){}
P=Object.assign({lv:0,ex:0,max:0,pts:0,best:{}},P||{});
if(P.lv>=LV.length||P.lv<0)P.lv=0;if(P.ex>=cnt(P.lv))P.ex=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};

const R=a=>a[Math.random()*a.length|0];
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function gen(lv,ex){
 const L=LV[lv];
 if(L.tx)return TEXTS[ex].text;
 if(ex==0){const pool=[...L.k];if(pool.length<3)pool.push('a','a');
  return Array.from({length:8},()=>Array.from({length:2+Math.random()*3|0},()=>R(pool)).join('')).join(' ')}
 if(ex==1)return sh(L.w).slice(0,8).join(' ');
 return sh(LV.slice(0,lv+1).flatMap(x=>x.w)).slice(0,10).join(' ');
}

// Nihol ballga qarab ösadi: 0 ball - urug', MAXP ball - katta daraxt
function tree(){
 const g=Math.min(1,(P.pts||0)/MAXP),h=10+g*110,w=2+g*9,top=200-h,cr=g*55;
 let s=`<svg viewBox="0 0 200 210" width="200" role="img" aria-label="Nihol"><line x1="10" y1="200" x2="190" y2="200" stroke="#8a8a80"/>`;
 if(g<0.03)s+=`<ellipse cx="100" cy="196" rx="6" ry="4" fill="#8b5a2b"/>`;
 else{
  s+=`<path d="M100 200 Q${100+g*3} ${200-h/2} 100 ${top}" stroke="#8b5a2b" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  const n=Math.round(g*14)+2;
  for(let i=0;i<n;i++){const a=i*2.4,r=cr*Math.sqrt((i+1)/n);s+=`<circle cx="${100+Math.cos(a)*r}" cy="${top+Math.sin(a)*r*.8}" r="${4+g*9}" fill="#3fa34d" fill-opacity=".85"/>`}
 }
 $('#tr').innerHTML=s+`</svg><div>Ball: <b>${P.pts||0}</b> / ${MAXP}</div>`;
}

let S={};
function start(){S={text:gen(P.lv,P.ex),i:0,err:0,tot:0,t0:0,done:false,bad:false};render()}

function render(){
 const L=LV[P.lv],n=cnt(P.lv);
 const name=L.tx?TEXTS[P.ex].a+': '+TEXTS[P.ex].t:['Harf maşqi','Söz maşqi','Takrorlaş'][P.ex];
 $('#info').innerHTML=`<b>Dars ${P.lv+1}/${LV.length}</b> · ${L.tx?'Adabiy matnlar':'yangi tugmalar: <b>'+[...L.k].join(' ')+'</b>'}<br>Maşq ${P.ex+1}/${n} - ${name}`;
 $('#map').innerHTML=LV.map((l,i)=>`<button data-i="${i}" class="${i==P.lv?'c':i<P.lv?'d':''}" ${i>P.max?'disabled':''}>${i+1}</button>`).join('');
 $('#res').hidden=true;paint();tree();
}

function paint(){
 $('#txt').innerHTML=[...S.text].map((ch,j)=>`<span class="${j<S.i?'ok':j==S.i?(S.bad?'cur bad':'cur'):''}">${ch}</span>`).join('');
 const nxt=S.text[S.i];
 const L=LV[P.lv],newSet=new Set(L.tx?[]:[...L.k].map(c=>c.toLowerCase()));
 const lo=nxt?nxt.toLowerCase():'';
 $('#kb').innerHTML=ROWS.map((r,ri)=>`<div class="r" style="margin-left:${ri*14}px">`+r.map(c=>`<i class="k ${newSet.has(lab(c))?'n':''} ${lo&&codeOf[lo]==c?'x':''}">${lab(c)}</i>`).join('')+'</div>').join('')+`<div class="r"><i class="k sp ${nxt==' '?'x':''}">probel</i></div>`;
 let h='';
 if(nxt){
  if(nxt==' ')h='Probel';
  else{const c=codeOf[lo];h=`<b>${nxt}</b> - `+(c?`<b>${cap(c)}</b> tugmasi`:EXTRA[nxt]||'belgi')+(c&&nxt!==lo?' + Shift':'');}
 }
 $('#hint').innerHTML=h;
}

function charOf(e){
 if(e.ctrlKey||e.metaKey||e.altKey)return null;
 const m=KEYMAP[e.code];
 if(m&&(e.key===m[0]||e.key===m[1]))return e.key===m[1]?m[2].toUpperCase():m[2];
 const k=e.key;if(k.length!==1)return null;
 return "'’ʻ".includes(k)?'ʼ':k;
}

addEventListener('keydown',e=>{
 if(e.target.tagName=='TEXTAREA')return;
 if(S.done){if(e.key=='Enter'){e.preventDefault();$('#go')&&$('#go').click()}return}
 const c=charOf(e);if(c===null)return;
 e.preventDefault();
 if(!S.t0)S.t0=Date.now();
 S.tot++;
 if(c===S.text[S.i]){S.bad=false;S.i++;if(S.i>=S.text.length){finish();return}}
 else{S.err++;S.bad=true}
 paint();
});

function finish(){
 S.done=true;
 const min=Math.max((Date.now()-S.t0)/60000,1/600);
 const wpm=Math.round(S.text.length/5/min),acc=Math.round(100*(S.tot-S.err)/S.tot),ok=acc>=PASS;
 const k=P.lv+'.'+P.ex,b=P.best[k]||{};
 let gain=0;
 if(ok){gain=b.pass?5:20+(acc>=98?10:0);P.pts=Math.min(MAXP,(P.pts||0)+gain)}
 P.best[k]={wpm:Math.max(b.wpm||0,wpm),acc:Math.max(b.acc||0,acc),pass:b.pass||ok};
 let msg='';
 if(ok){
  if(P.ex+1<cnt(P.lv))P.ex++;
  else if(P.lv+1<LV.length){P.lv++;P.ex=0;P.max=Math.max(P.max,P.lv);msg=`Yangi dars: <b>${P.lv+1}</b>`}
  else P.ex=0;
 }
 save();paint();tree();
 const r=$('#res');r.hidden=false;
 r.innerHTML=`<b>${ok?'Ötdingiz':'Qayta urinib köring'}</b> - tezlik: ${wpm} söz/daq, aniqlik: ${acc}% (kerak: ${PASS}%)${ok?` · <b>+${gain} ball</b>`:''}<br>${msg}<br><button id="go" style="margin-top:8px">${ok?'Davom etiş':'Qayta urinib köriş'}</button>`;
 $('#go').onclick=start;
}

$('#map').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;P.lv=+b.dataset.i;P.ex=0;save();start()};
$('#rs').onclick=e=>{
 const b=e.target;
 if(!b.dataset.s){b.dataset.s=1;b.textContent='Aniqmi? Yana bosing';setTimeout(()=>{delete b.dataset.s;b.textContent='Boşidan'},3000);return}
 P={lv:0,ex:0,max:0,pts:0,best:{}};save();delete b.dataset.s;b.textContent='Boşidan';start();
};

// Eski lotin -> yangi alifbo (matnlarni tayyorlaş uçun)
function conv(s){
 return s.replace(/[ʻʼ‘’'`´]/g,"'")
  .replace(/([oOgG])'/g,(m,c)=>({o:'ö',O:'Ö',g:'ğ',G:'Ğ'})[c])
  .replace(/sh/g,'ş').replace(/S[hH]/g,'Ş').replace(/ch/g,'ç').replace(/C[hH]/g,'Ç')
  .replace(/'/g,'ʼ');
}
$('#cb').onclick=()=>{$('#co').value=conv($('#ci').value)};

start();
</script>
</body>
</html>

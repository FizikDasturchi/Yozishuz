<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>yozish.uz — prototip</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<!-- Dizayn (ranglar, şriftlar, joylaşuv) src/design/design.js da. Sahifa çizilmasdan oldin yuklanadi. -->
<script src="src/design/design.js"></script>
</head>
<body>
<header id="hd"><div class="in"><div class="logo">yozish<span>.uz</span></div><small>Yangi alifboda tez yozişni örganamiz</small></div></header>
<main>
<div id="home">
 <section class="card hero"><div id="tr"></div><div class="chips" id="st"></div></section>
 <div id="wk"></div>
 <div id="units"></div>
 <details><summary>Yangi harflar klaviaturada</summary>
 <table><tr><th>Harf</th><th>Tugma (QWERTY)</th></tr>
 <tr><td>Ş ş</td><td>W</td></tr><tr><td>Ç ç</td><td>C</td></tr><tr><td>Ö ö</td><td>[</td></tr><tr><td>Ğ ğ</td><td>]</td></tr><tr><td>ʼ (tutuq)</td><td>'</td></tr></table>
 <p class="mut">Bosh harf — Shift bilan. Nuqta va vergul öz joyida. Turk klaviaturasida ö, ğ, ş, ç bor — ular ham qabul qilinadi.</p></details>
 <details><summary>Ustoz uçun: matn konvertori va söz banki</summary>
 <textarea id="ci" placeholder="Eski lotin matnini qöying: o‘zbek, g‘alaba, shahar, choy..."></textarea>
 <button class="sm" id="cb">Konvertlaş</button> <button class="sm" id="wb">Sözlar röyxati</button> <button class="sm" id="sb">Bankka qöşiş</button> <span id="bn"></span>
 <textarea id="co"></textarea></details>
 <p><button class="sm" id="rs">Boşidan</button></p>
</div>

<div id="pr" hidden>
 <div class="pbar"><button id="ex">« Darslar</button><b id="pt"></b><button id="rd">Qayta</button><button id="sn">Tovuş ✓</button></div>
 <div class="sg" id="sg"></div>
 <div id="play">
  <div id="fc" class="card" hidden></div>
  <div id="gm" hidden></div>
  <div id="txt"></div><div id="lv"></div><div id="hint"></div>
  <div id="kbs">
   <div id="kbw"><div id="kb"></div></div>
   <svg id="hsv" viewBox="0 0 15 6.9" aria-label="Qöllar"></svg>
   <div class="kbsp"></div>
  </div>
 </div>
 <div id="res" class="card" hidden></div>
</div>
</main>
<noscript>Bu sayt ishlaşi uçun JavaScript kerak.</noscript>

<script src="src/ui/games.js"></script>
<script src="src/ui/screens.js"></script>
<script src="src/ui/input.js"></script>
<script src="src/tools/converter.js"></script>
<script src="src/app.js"></script>
</body>
</html>
